aid: nimble
name: Nimble
description: >-
  Nimble is a relationship-focused CRM that unifies contacts, communications, social profiles, calendar
  and email into a single shared record for small businesses and whole-company teams. Founded in 2010
  by GoldMine co-founder Jon Ferrara and headquartered in Santa Monica, California, the platform combines
  contact management, sales pipelines, email marketing, sequences, web forms, web chat and workflow automation,
  and enriches contact profiles automatically from email, calendar, social and web data. Nimble publishes
  a full OpenAPI 3.0.0 contract for its REST API — 89 operations over contacts, user-definable contact
  fields, contact and deal pipelines, deals, leads, activities, tasks and messages — authenticated with
  an account API key or OAuth 2.0 authorization_code.
