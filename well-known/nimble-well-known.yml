oauth_discovery:
  rfc8414_metadata: false
  note: >-
    Nimble runs OAuth 2.0 authorization_code (authorize at
    https://app.nimble.com/oauth/authorize, token at
    https://app.nimble.com/api/oauth/token) but publishes no RFC 8414
    authorization-server metadata and no OIDC discovery document, so the
    endpoints cannot be discovered programmatically — only read out of prose
    in the developer reference.
