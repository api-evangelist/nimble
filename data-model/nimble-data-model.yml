notes: |-
  Entity-relationship graph derived from the 180 component schemas in the OpenAPI 3.0.0 document Nimble embeds in its developer reference. Nimble namespaces every schema with a domain prefix (Contacts.*, Deals.*, Accounts.*), so the domain grouping below is the provider's own, not an imposed one. Structural relationships come from $ref links and are high confidence; belongs_to edges are inferred from id-reference field names and are marked medium confidence.
  The central modelling fact for any integrator: a Nimble contact is NOT a flat record. Contact fields are returned as a map of field-name -> array of {value, label, modifier} objects, so a single logical attribute (phone, email, address, URL) carries several labelled values at once, and the field set itself is user-definable through the Contacts Fields API.
