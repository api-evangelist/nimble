notes: >-
  Nimble publishes NO rate limits for its REST API. The full OpenAPI 3.0.0
  document Nimble embeds in its developer reference (58 paths / 89
  operations) declares no 429 response on any operation, documents no
  RateLimit-* / X-RateLimit-* / Retry-After response headers, and its
  "Handling Errors" reference enumerates only 402 (quota, code 108), 409
  (validation, code 245), 404 and 500 (code 107) — none of which is a
  throttling signal. The API-access support article
  (https://support.nimble.com/en/articles/502755-nimble-api-access) is
  likewise silent on limits. This is a recorded absence, not an unchecked
  field — an agent integrating Nimble has no published runtime backpressure
  contract to honor.
caution: >-
